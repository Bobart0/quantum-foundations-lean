name: CI
on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Garde anti-axiome
        run: bash scripts/guard.sh

  build:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      # leanprover/lean-action détecte le workspace Lake, récupère le cache Mathlib
      # (lake exe cache get) et lance `lake build` — aucune option supplémentaire
      # nécessaire pour ce projet (config par défaut vérifiée).
      - uses: leanprover/lean-action@v1
      # Leaf audits run independently; the aggregate imports only public facades.
      - name: Downstream API contracts
        run: |
          lake env lean QuantumFoundations/Audit/FiniteTensorAPIContract.lean
          lake env lean QuantumFoundations/Audit/SelectorBridgeAPIContract.lean
          lake env lean QuantumFoundations/Audit/NaimarkImplementationAPIContract.lean
          lake env lean QuantumFoundations/Audit/EverettianAPIContract.lean
          lake env lean QuantumFoundations/Audit/EverettianDownstreamContracts.lean

      - name: External downstream consumer - local path
        run: |
          python3 scripts/check_downstream_api_consumer.py \
            --source-path "$GITHUB_WORKSPACE"

      - name: External downstream consumer - pushed Git SHA
        if: github.event_name == 'push'
        run: |
          python3 scripts/check_downstream_api_consumer.py \
            --git-url "https://github.com/${GITHUB_REPOSITORY}.git" \
            --rev "${GITHUB_SHA}"
