name: Lean
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Build QuantumFoundations
        run: lake build QuantumFoundations
      - name: Publication theorem audit
        run: lake env lean QuantumFoundations/Audit/PublicationCore.lean
      - name: Downstream API regression audit
        run: lake env lean QuantumFoundations/Audit/DownstreamAPI.lean
      - name: Source guard
        run: bash scripts/guard.sh
      - name: Diff hygiene
        run: git diff --check
