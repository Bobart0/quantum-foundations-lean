name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  AUDITED_SHA: 50021f2fbb15b964ac7337a79ee2b893429fbdfc

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release delta
        shell: bash
        run: |
          changed="$(git diff --name-only "$AUDITED_SHA" "$GITHUB_SHA")"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(README\.md|PUBLICATION_ARTIFACT\.md|AFM_ARTIFACT\.md|docs/REPRODUCIBILITY\.md|QuantumFoundations/Audit/PublicationCore\.lean|QuantumFoundations/Audit/AFM\.lean|scripts/verify_publication\.sh|scripts/verify_afm\.sh|lakefile\.toml|lake-manifest\.json|\.github/workflows/lean\.yml|\.github/workflows/release\.yml|\.zenodo\.json|CITATION\.cff|RELEASE_NOTES_v1\.4\.3\.md)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          git diff --check "$AUDITED_SHA" "$GITHUB_SHA"

      - uses: leanprover/lean-action@v1

      - name: Publication theorem audit
        run: lake env lean QuantumFoundations/Audit/PublicationCore.lean

      - name: Source guard
        run: bash scripts/guard.sh

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          tag="${subject#Release }"
          notes="RELEASE_NOTES_${tag}.md"
          test -f "$notes"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES"
          fi

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release view "$TAG" --json tagName,targetCommitish,publishedAt,url
