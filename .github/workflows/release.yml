name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leanprover/lean-action@v1

      - name: Full release validation
        run: |
          lake build QuantumFoundations
          lake env lean QuantumFoundations/Audit/FoP.lean
          lake env lean QuantumFoundations/Audit/DownstreamAPI.lean
          lake env lean QuantumFoundations/Audit/JournalCore.lean
          lake env lean QuantumFoundations/Audit/FiniteTensorAPIContract.lean
          lake env lean QuantumFoundations/Audit/SelectorBridgeAPIContract.lean
          lake env lean QuantumFoundations/Audit/NaimarkImplementationAPIContract.lean
          lake env lean QuantumFoundations/Audit/EverettianAPIContract.lean
          lake env lean QuantumFoundations/Audit/EverettianDownstreamContracts.lean
          bash scripts/guard.sh
          python3 scripts/check_downstream_api_consumer.py --source-path "$GITHUB_WORKSPACE"
          python3 scripts/check_downstream_api_consumer.py \
            --git-url "https://github.com/${GITHUB_REPOSITORY}.git" \
            --rev "${GITHUB_SHA}"
          git diff --check

      - name: Resolve release tag and notes
        id: release_meta
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          tag="${subject#Release }"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[-A-Za-z0-9.]*$ ]]; then
            echo "Invalid release tag derived from commit subject: $tag" >&2
            exit 1
          fi
          notes="RELEASE_NOTES_${tag}.md"
          test -f "$notes"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          NOTES: ${{ steps.release_meta.outputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file "$NOTES"
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: gh release view "$TAG" --json tagName,targetCommitish,publishedAt,url
