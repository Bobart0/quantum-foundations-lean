name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  AUDITED_SHA: 483e0269f433ab6f39a2aa1fa21fc1bce1180913

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scientific tree unchanged since audited head
        shell: bash
        run: |
          changed="$(git diff --name-only "$AUDITED_SHA" "$GITHUB_SHA")"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(README\.md|AFM_ARTIFACT\.md|docs/REPRODUCIBILITY\.md|\.github/workflows/release\.yml|\.zenodo\.json|CITATION\.cff|RELEASE_NOTES_v1\.4\.2-afm-final\.md)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes since audited head:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          bash scripts/guard.sh
          git diff --check "$AUDITED_SHA" "$GITHUB_SHA"

      - name: Resolve release tag and notes
        id: release_meta
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          tag="${subject#Release }"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[-A-Za-z0-9.]*$ ]]; then
            echo "Invalid release tag derived from commit subject: $tag" >&2
            exit 1
          fi
          notes="RELEASE_NOTES_${tag}.md"
          test -f "$notes"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          NOTES: ${{ steps.release_meta.outputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file "$NOTES"
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: gh release view "$TAG" --json tagName,targetCommitish,publishedAt,url
